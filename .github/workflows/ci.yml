name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inspect CI workspace
        run: |
          echo "GitHub workspace: $GITHUB_WORKSPACE"
          echo "Current working directory:"
          pwd
          echo "Workspace files:"
          ls -la
          echo "Runner temporary directory: $RUNNER_TEMP"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Snyk dependency scan
        uses: snyk/actions/node@master
        with:
          command: test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Code scan
        uses: snyk/actions/node@master
        with:
          command: code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Prepare production dependencies
        run: npm prune --omit=dev

      - name: Generate deployment artifact
        run: |
          mkdir -p artifacts

          tar -czf "artifacts/devops-task-tracker-${GITHUB_SHA}.tar.gz" \
            app.js \
            server.js \
            package.json \
            package-lock.json \
            node_modules

          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS

          ls -lh

      - name: Generate release notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)

          {
            echo "# Release Notes"
            echo ""
            echo "- Application Version: $VERSION"
            echo "- Commit SHA: $GITHUB_SHA"
            echo "- Build Number: $GITHUB_RUN_NUMBER"
            echo "- Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## Changes"
            echo ""

            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo ""
              git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %h %s"
            else
              echo "Initial release - complete commit history:"
              echo ""
              git log HEAD --pretty=format:"- %h %s"
            fi

            echo ""
          } > artifacts/RELEASE_NOTES.md

          cat artifacts/RELEASE_NOTES.md

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: devops-task-tracker-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
